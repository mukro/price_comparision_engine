version: "3.8"

services:
  # ==========================================
  # 1. POSTGRESQL + PGVECTOR DATABASE
  # ==========================================
  db:
    image: pgvector/pgvector:pg16
    container_name: price_db
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # ==========================================
  # 2. REDIS (Cache & Celery Broker)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: price_redis
    restart: always
    env_file: .env
    command: >
      sh -c "redis-server --requirepass $${REDIS_PASSWORD} --bind 0.0.0.0"
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # ==========================================
  # 3. FASTAPI API SERVER
  # ==========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: price_api
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

  # ==========================================
  # 4. CELERY WORKER (Scraping & Product Matching)
  # ==========================================
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: price_celery_worker
    restart: always
    command: celery -A app.celery_app:celery_app worker --loglevel=info --concurrency=4
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

  # ==========================================
  # 5. CELERY BEAT (Periodic Task Scheduler)
  # ==========================================
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: price_celery_beat
    restart: always
    command: celery -A app.celery_app:celery_app beat --loglevel=info
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

  # ==========================================
  # 6. PROMETHEUS + GRAFANA (Monitoring)
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: price_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - promdata:/prometheus
    depends_on:
      - api
    networks:
      - app_network

  grafana:
    image: grafana/grafana:latest
    container_name: price_grafana
    restart: always
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - app_network

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:

networks:
  app_network:
    driver: bridge
